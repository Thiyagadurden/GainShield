# GainShield default configuration.
#
# EVERY numerical value below is an ENGINEERING ASSUMPTION for simulation,
# not a rating of any real charger. Source/rationale tags:
#   [A-x]  = assumption, explained in docs/ASSUMPTIONS.md
# Change values here; nothing else in the code hard-codes them.

[plant]
P_rated_W        = 30000.0   # [A-1] rated module power (one module of a DC fast charger)
Vdc_ref_V        = 800.0     # [A-2] DC-link reference (800 V-class EV platforms)
C_nom_F          = 2.0e-3    # [A-3] DC-link capacitance, nominal
C_tol            = 0.20      # [A-3] +/-20 % capacitance uncertainty (spec requirement)
Vg_ll_rms_V      = 415.0     # [A-4] Indian LV three-phase grid, line-line RMS
Vg_range         = [0.80, 1.10]  # [A-4] grid voltage band considered (per-unit)
R_loss_ohm       = 20000.0   # [A-5] lumped DC-side loss/bleeder resistance
eta_afe          = 0.98      # [A-6] AFE efficiency (applied direction-dependently)
tau_i_nom_s      = 0.5e-3    # [A-7] inner current-loop closed-loop time constant
tau_i_range_s    = [0.3e-3, 1.0e-3]
tau_dcdc_s       = 2.0e-3    # [A-8] DC-DC battery-power loop time constant
dcdc_slew_W_per_s = 2.0e6    # [A-8] DC-DC power slew limit (2 kW per ms)

[converter]
f_sw_Hz          = 10000.0   # [A-9] switching frequency
f_s_Hz           = 10000.0   # [A-9] control sampling = switching (single update)
delay_nom_samples = 1.5      # [A-10] 1 computation + 0.5 PWM delay
delay_range_samples = [1.0, 2.0]
substeps         = 10        # plant integration substeps per control period
I_grid_max_A     = 80.0      # [A-11] AFE d-axis current limit (peak)
P_dcdc_max_W     = 30000.0   # [A-11] battery-side power limit (both directions)

[constraints]
V_band_op        = 0.05      # [A-12] operational band +/-5 % (counted as violation)
V_band_trip      = 0.10      # [A-12] protection trip band +/-10 %
I_margin_frac    = 0.95      # [A-12] |i| above 95 % of limit counts as current violation
settle_band_frac = 0.005     # settling band: +/-0.5 % of Vref (4 V at 800 V)
PM_min_deg       = 40.0      # [A-13] required WORST-CASE phase margin over the uncertainty set
GM_min_dB        = 6.0       # [A-13] required gain margin
MM_min           = 0.5       # [A-13] required modulus (disk) margin, min|1+L|

[baseline]
# Manual tuning: symmetric optimum on nominal plant with conservative a = 3.5
so_a             = 3.5

[gains_box]
# Outer search box (log-uniform); the certified region is a subset.
Kp_range = [0.2, 12.0]       # A/V
Ki_range = [5.0, 5000.0]     # A/(V s)

[optimizer]
beta             = 2.0       # confidence multiplier (SafeOpt-style)
n_grid           = 41        # candidate grid per gain axis (log space)
n_init           = 3         # initial safe design points around baseline
iters_per_context = 25
safety_margin_min = 0.15     # GP lower bound of normalised margin must exceed this
sigma_max_accept = 0.25      # reject proposals with GP safety std above this
seed             = 7

[supervisor]
V_abort_frac     = 0.04      # abort candidate if |Vdc-Vref| > 4 % (inside the 5 % band)
I_abort_frac     = 0.97      # abort if |i| > 97 % of limit for > hold time
I_abort_hold_s   = 2.0e-3
osc_window_s     = 10.0e-3   # oscillation detector window
osc_rms_V        = 6.0       # abort if voltage-error RMS in window exceeds this
context_envelope = { C_pu = [0.75, 1.25], Vg_pu = [0.78, 1.12], tau_i_ms = [0.25, 1.1], delay_samples = [0.9, 2.1] }

[noise]
v_sigma_V        = 1.0       # [A-14] DC voltage sensor noise (1 sigma)
i_sigma_A        = 0.5       # [A-14] current sensor noise

[context_estimation]
# [A-15] Bounds on context-estimation error used by the CONTEXT-CONDITIONED
# margin certificate (tier 2). Simulated estimation errors are drawn well
# inside these bounds (C: sigma 1.5 %, tau: 5 %, delay: 0.05 samples).
C_err      = 0.05     # relative
vg_err     = 0.03     # relative (measured with a 2 ms filter)
tau_err    = 0.20     # relative
delay_err  = 0.20     # samples
